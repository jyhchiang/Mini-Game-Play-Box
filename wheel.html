<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lucky Decision Wheel</title>
	
	


    <style>
        :root {
            --bg-color: #0d0f18;
            --primary-color: #ff3b60;
            --accent-glow: #7928ca;
            --text-main: #ffffff;
            --font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-family);
            min-height: 100vh;
            display: flex; justify-content: center; align-items: center;
            overflow-x: hidden;
        }

        .container {
            width: 100%; max-width: 650px;
            padding: 24px;
            display: flex; flex-direction: column; align-items: center; gap: 24px;
            text-align: center;
        }

        header h1 { font-size: 2.2rem; background: linear-gradient(135deg, #fff 0%, #a0a5b5 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        header p { font-size: 2.8rem; font-weight: 600; color: #e2e8f0; margin-top: 4px; }

        .wheel-wrap { position: relative; width: 450px; height: 450px; margin: 10px 0; }
        #wheel { width: 100%; height: 100%; object-fit: contain; will-change: transform; }
        #pointer {
            position: absolute; top: calc(50% - 2px); 
			left: calc(50% + 1px);
            width: 280px; height: auto; z-index: 10;
            transform-origin: 50% 58%;
            transform: translate(-50%, -58%) rotate(0deg);
            pointer-events: none; will-change: transform;
        }

        .spin-button {
            width: 100%; max-width: 280px; padding: 16px 24px;
            font-size: 1.1rem; font-weight: 700; color: #fff;
            background: linear-gradient(135deg, var(--primary-color), var(--accent-glow));
            border: none; border-radius: 50px; cursor: pointer;
            box-shadow: 0 8px 25px rgba(255, 59, 96, 0.4);
            transition: all 0.2s ease;
        }
        .spin-button:disabled { opacity: 0.5; cursor: not-allowed; }

        .result-card {
            width: min(450px, 90vw); margin-top: 20px; padding: 25px; border-radius: 20px;
            background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px);
            border: 2px solid rgba(212, 175, 55, 0.4); box-shadow: 0 15px 30px rgba(0,0,0,0.2);
            transition: 0.3s ease;
        }
        .result-text { font-size: 38px; font-weight: bold; color: #8d6a00; }
        .result-message { font-size: 22px; color: #5f4a13; margin-top: 10px; }
        .hidden { opacity: 0; visibility: hidden; transform: translateY(20px); }
        .show { opacity: 1; visibility: visible; transform: translateY(0); }

		/* 手機版排版調整（縮小按鈕上下間距） */
        @media (max-width: 700px) {
            .container {
                padding: 15px 20px;
                gap: 12px;          /* 縮小全元件整體間距 */
            }

            header h1 {
                font-size: 1.7rem;
            }

            header p {
                font-size: 1.8rem;
                margin-bottom: 6px; /* 1. 副標題與圓盤間隔適度拉近 */
            }

            .wheel-wrap {
                width: 85vw;
                height: 85vw;
                max-width: 320px;
                max-height: 320px;
                margin: 0;          /* 移除轉盤上下額外邊距 */
            }

            #pointer { width: 62%; }

            .spin-button {
                margin-top: 3px;    /* 2. ✅ CLICK TO SPIN 與圓盤拉近 (把 10 縮小成 5) */
                width: 70%;
                font-size: 18px;
            }

            .result-card {
                margin-top: 12px;    /* 3. ✅ 最下面的字與 CLICK TO SPIN 拉近 (把 15 縮小成 8) */
                padding: 16px;
            }

            .result-text {
                font-size: 32px;
            }

            .result-message {
                font-size: 18px;
            }
        }

    </style>
</head>

<body>

<main class="container">
    <header>
        <h1>Lucky Decision Wheel</h1>
        <p>幸運決策轉盤</p>
    </header>

    <div class="wheel-wrap">
        <img id="wheel" src="images/wheel_game.png" alt="Wheel" draggable="false">
        <img id="pointer" src="images/pointer.png" alt="Pointer" draggable="false">
    </div>

    <button id="spinButton" class="spin-button">CLICK TO SPIN</button>

    <section id="resultCard" class="result-card hidden">
        <div id="resultText" class="result-text">-</div>
        <div id="resultMessage" class="result-message">-</div>
    </section>
</main>

<!-- Audio 資源 -->
<audio id="spinSound" src="sounds/spin.mp3" preload="auto"></audio>
<audio id="clickSound" src="sounds/click.mp3" preload="auto"></audio>
<audio id="stopSound" src="sounds/stop.mp3" preload="auto"></audio>

<script>
    "use strict";

    const wheelItems = [
        { text: "Yes", message: "相信你的第一直覺。" },
        { text: "No", message: "目前不是最佳時機。" },
        { text: "OK", message: "可以開始行動。" },
        { text: "不接受", message: "勇敢拒絕，也是尊重自己。" },
        { text: "再想想", message: "多給自己一點時間。" },
        { text: "先喝杯咖啡", message: "休息一下，再回來思考。" },
        { text: "睡一覺", message: "明天也許就有答案。" },
        { text: "找人商量", message: "另一個角度值得參考。" },
        { text: "等時機", message: "耐心也是一種選擇。" },
        { text: "先試試", message: "開始，比完美更重要。" },
        { text: "順其自然", message: "放鬆一點，相信事情會有答案。" }
    ];

    const pointer = document.getElementById("pointer");
    const spinButton = document.getElementById("spinButton");
    const resultCard = document.getElementById("resultCard");
    const resultText = document.getElementById("resultText");
    const resultMessage = document.getElementById("resultMessage");

    const spinSound = document.getElementById("spinSound");
    const clickSound = document.getElementById("clickSound");
    const stopSound = document.getElementById("stopSound");

    const ITEM_COUNT = wheelItems.length;
    const SECTOR = 360 / ITEM_COUNT;
    const EXTRA_ROUNDS = 8;
    const SPIN_TIME = 6000;

    let spinning = false;
    let currentAngle = 0;
    let spinFadeInterval = null;
    let audioUnlocked = false;

    // 🎯 初始化排版
    if (pointer) pointer.style.transform = "translate(-50%, -58%) rotate(0deg)";

    // 🎯 註冊事件（關鍵：同時綁定 click 與 touchend）
    if (spinButton) {
        spinButton.addEventListener("click", handleSpinRequest);
        spinButton.addEventListener("touchend", function(e) {
            e.preventDefault(); // 防止與 click 衝突
            handleSpinRequest();
        });
    }

    // 🎯 點擊通用處理函式
    function handleSpinRequest() {
        if (spinning || !pointer || !spinButton) return;
        
        // 第一次點擊，解鎖音效
        forceUnlockAudio();
        
        // 開始旋轉
        spin();
    }

    // 🎯 解鎖手機音效權限
    function forceUnlockAudio() {
        if (audioUnlocked) return;
        
        // 嘗試播放一個無聲或極短的聲音來開通
        if (clickSound) {
            clickSound.volume = 0;
            clickSound.play().then(() => {
                clickSound.pause();
                clickSound.volume = 1;
                audioUnlocked = true;
            }).catch(() => {});
        }
        
        if (spinSound) spinSound.load();
        if (stopSound) stopSound.load();
    }

    function spin() {
        spinning = true;
        spinButton.disabled = true;

        if (resultCard) {
            resultCard.classList.remove("show");
            resultCard.classList.add("hidden");
        }

        // 安全播放點擊聲，報錯也不卡死
        try { playClickSound(); } catch (e) {}

        const winner = Math.floor(Math.random() * ITEM_COUNT);
        const sectorAngle = (winner * SECTOR);
        const baseAngle = currentAngle - (currentAngle % 360);
        const targetAngle = baseAngle + (EXTRA_ROUNDS * 360) + sectorAngle;

        animatePointer(currentAngle, targetAngle, winner);
    }

    function animatePointer(startAngle, endAngle, winnerIndex) {
        playSpinSound();
        const startTime = performance.now();

        function update(now) {
            const elapsed = now - startTime;
            let progress = elapsed / SPIN_TIME;
            if (progress > 1) progress = 1;

            const eased = easeInOutCubic(progress);
            const angle = startAngle + (endAngle - startAngle) * eased;

            if (pointer) {
                pointer.style.transition = "none";
                pointer.style.transform = `translate(-50%, -58%) rotate(${angle}deg)`;
            }

            if (progress < 1) {
                requestAnimationFrame(update);
            } else {
                stopSpinSound();
                playStopSound();
                finishSpin(endAngle, winnerIndex);
            }
        }
        requestAnimationFrame(update);
    }

    function finishSpin(finalAngle, winnerIndex) {
        currentAngle = finalAngle;
        spinning = false;
        spinButton.disabled = false;
        showResult(winnerIndex);
    }

    function showResult(index) {
        if (index === undefined || !wheelItems[index] || !resultCard) return;
        const item = wheelItems[index];
        resultText.textContent = item.text;
        resultMessage.textContent = item.message;
        resultCard.classList.remove("hidden");
        resultCard.classList.add("show");
    }

    function easeInOutCubic(t) {
        return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    }

    // 🎯 音效處理（加入安全機制，手機不卡死）
    function playClickSound() {
        if (!clickSound) return;
        try {
            clickSound.pause();
            // 💡 安全檢查：載入完成才跳過空白，否則從頭播，絕對不報錯
            if (clickSound.readyState >= 1 && clickSound.duration > 0.15) {
                clickSound.currentTime = 0.15;
            } else {
                clickSound.currentTime = 0;
            }
            clickSound.play().catch(() => {});
        } catch (e) {}
    }

    function playSpinSound() {
        if (!spinSound) return;
        if (spinFadeInterval) clearInterval(spinFadeInterval);
        try {
            spinSound.pause();
            spinSound.currentTime = 0;
            spinSound.volume = 1.0;
            spinSound.play().catch(() => {});
        } catch (e) {}
    }

    function stopSpinSound() {
        if (!spinSound) return;
        if (spinFadeInterval) clearInterval(spinFadeInterval);
        let curVol = spinSound.volume;
        spinFadeInterval = setInterval(() => {
            curVol -= 0.1;
            if (curVol <= 0) {
                clearInterval(spinFadeInterval);
                spinSound.volume = 0; spinSound.pause();
            } else { spinSound.volume = Math.max(0, curVol); }
        }, 50);
    }

    function playStopSound() {
        if (!stopSound) return;
        try {
            stopSound.pause();
            stopSound.currentTime = 0;
            stopSound.volume = 1;
            stopSound.play().catch(() => {});
        } catch (e) {}
    }
</script>

</body>
</html>
