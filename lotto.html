<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>台灣大樂透</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:
    radial-gradient(circle at center,#5a3700 0%, #120b00 80%);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    padding:15px;
}

/* 主機台 */

.machine{
    width:100%;
    max-width:700px;
    margin:auto;
    background:
    linear-gradient(to bottom,#ffd96d,#b67800);
    border-radius:30px;
    padding:20px;
    overflow:hidden;
    box-shadow:
    0 0 40px rgba(255,180,0,.5),
    inset 0 0 20px rgba(255,255,255,.3);
    position:relative;
    container-type: inline-size;
}

/* 背景圖 */

.machineBg{
    width:100%;
    display:block;
    user-select:none;
    pointer-events:none;
    -webkit-user-drag:none;
}

.machine::before{
    content:"";
    position:absolute;
    top:10px;
    left:10px;
    right:10px;
    bottom:10px;
    border-radius:25px;
    border:3px solid rgba(255,255,255,.3);
    box-shadow:
    inset 0 0 25px rgba(255,255,255,.25),
    0 0 25px rgba(255,200,0,.2);
    pointer-events:none;
}

/* 數字區（已修正比例與位置） */

.reels{
    display:flex;
    justify-content:space-between;
    align-items:center;
    position:absolute;
    top:44.2%;          /* 修正：往下一點點 */
    left:14.8%;         /* 修正：往右置中 */
    width:70.4%;        /* 修正：左右完美對稱 */
    height:12.6%;       /* 修正：縮小高度，完美塞入黑框內部 */
}

.reelBox{
    width: 14.2%;
    height: 100%;
    overflow:hidden;
    position:relative;
    border-radius:8px;
    background:
    linear-gradient(
        to bottom,
        #fff9df 0%,
        #fff2c7 5%,
        #f7dfa0 18%,
        #e9c56d 30%,
        #ffeeb8 60%,
        #f6d983 68%,
        #dfb85f 72%,
        #c99738 86%
    );
    box-shadow:
    inset 0 4px 6px rgba(255,255,255,.52),
    inset 0 0 8px rgba(255,245,200,.35),
    inset 0 -4px 6px rgba(120,70,0,.22);
}

.reelBox.special{
    border-color:#c40000;
}

.reel{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height: 100%;
    transform:translateY(0%);
    will-change:transform;
}

.num{
    width:100%;
    height:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size: 4.2cqw;
    font-weight:900;
    color:#111;
    line-height:1;
    text-align:center;
    text-shadow:
    0 2px 3px rgba(0,0,0,.45),  
    0 0 6px rgba(255,220,120,.35);
    user-select:none;
}

/* 按鈕 */

button:active{
    transform:translateY(5px);
    box-shadow:none;
}

.hitBtn{
    position:absolute;
    left:35%;
    bottom:20.5%;
    width:30%;
    height:11%;
    opacity:0;
    cursor:pointer;
    z-index:50;
    border:none;
    background:transparent;
}

/* 音效波形 */

.soundArea{
    position:absolute;
    left:5%;
    bottom:11.9%;
    width:90%;
    height:14%;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:flex-end;
    gap:3px;
    padding:0 8px;
}

.bar{
    width:4px;
    min-height:8px;
    border-radius:999px;
    background:
    linear-gradient(
        to top,
        #ff9900,
        #ffd84d,
        #fff3a0
    );
    animation:
    sound .45s infinite ease-in-out;
    animation-play-state:paused;
    box-shadow:
    0 0 5px #ffcc00,
    0 0 12px #ff9900;
}

@keyframes sound{
    0%{height:5px;}
    50%{height:26px;}
    100%{height:10px;}
}

/* 手機版適應 */

@media(max-width:768px){
    .soundArea{
        left:5%;
        bottom:11.4%;
        width:90%;
        height:11%;
        gap:2px;
        padding:0 4px;
    }

    .bar{
        width:3px;
    }
}
/* 用 Margin 強制推開左右號碼框 (加上 !important 確保不被 Flex 抵銷) */

.reelBox:nth-child(1) {
    margin-right: 20px !important;
}

.reelBox:nth-child(2) {
    margin-right: 8px !important;
}

.reelBox:nth-child(5) {
    margin-left: 8px !important;
}

.reelBox:nth-child(6) {
    margin-left: 20px !important;
}

</style>

</head>

<body>

<div class="machine">

    <!-- 背景拉霸機圖片 -->

    <img
    src="images/slot.png"
    class="machineBg">

    <!-- 數字區 -->

    <div class="reels"
    id="reels"></div>

    <!-- 透明按鈕 -->

    <button
    class="hitBtn"
    onclick="startLottery()">
    </button>

    <!-- 音效波形 -->

    <div class="soundArea"
    id="soundArea"></div>    

</div>

<script>

/* =========================
   建立號碼輪盤
========================= */

/* =========================
   建立號碼輪盤 (JS 強制微調位移)
========================= */

const reelsDiv = document.getElementById("reels");

// 定義 6 個框分別要向左/向右推的百分比
const offsets = [3, 1.2, 0, 0, -1.2, -3]; 

for(let i=0; i<6; i++){

    let box = document.createElement("div");
    box.className = "reelBox";
    
    // 直接用 JS 給予相對定位與位移，無視所有 CSS 衝突！
    box.style.position = "relative";
    box.style.left = offsets[i] + "%";

    let reel = document.createElement("div");
    reel.className = "reel";

    for(let j=1; j<=49; j++){
        let num = document.createElement("div");
        num.className = "num";
        num.innerText = String(j).padStart(2,"0");
        reel.appendChild(num);
    }

    box.appendChild(reel);
    reelsDiv.appendChild(box);
}
/* =========================
   音效波形
========================= */

const soundArea = document.getElementById("soundArea");

const bars = [];

for(let i=0;i<65;i++){

    const bar = document.createElement("div");

    bar.className = "bar";

    bar.style.animationDelay =
        (Math.random()*0.6)+"s";

    soundArea.appendChild(bar);
    bars.push(bar);
}

/* =========================
   Web Audio API 音效
========================= */

const audioCtx =
new(window.AudioContext ||
window.webkitAudioContext)();

/* 拉霸轉動音 */

function playSpin(){

    const osc = audioCtx.createOscillator();

    const gain = audioCtx.createGain();

    osc.type = "square";

    osc.frequency.value =
        400 + Math.random()*200;

    gain.gain.value = 0.03;

    osc.connect(gain);

    gain.connect(audioCtx.destination);

    osc.start();

    osc.stop(audioCtx.currentTime + 0.04);
}

/* 停止音效 */

function playStop(){

    const osc = audioCtx.createOscillator();

    const gain = audioCtx.createGain();

    osc.type = "triangle";

    osc.frequency.value = 220;

    gain.gain.value = 0.15;

    osc.connect(gain);

    gain.connect(audioCtx.destination);

    osc.start();

    osc.frequency.exponentialRampToValueAtTime(
        60,
        audioCtx.currentTime + 0.3
    );

    osc.stop(audioCtx.currentTime + 0.3);
}

/* 中獎完成音 */

function playWin(){

    const notes = [523,659,784,1046];

    notes.forEach((freq,index)=>{

        const osc =
        audioCtx.createOscillator();

        const gain =
        audioCtx.createGain();

        osc.type = "sine";

        osc.frequency.value = freq;

        gain.gain.value = 0.08;

        osc.connect(gain);

        gain.connect(audioCtx.destination);

        osc.start(
            audioCtx.currentTime + index*0.12
        );

        osc.stop(
            audioCtx.currentTime + index*0.12 + 0.2
        );
    });
}

/* =========================
   隨機號碼
========================= */

function generateNumbers(){

    let nums = [];

    while(nums.length < 6){

        let n =
        Math.floor(Math.random()*49)+1;

        if(!nums.includes(n)){

            nums.push(n);
        }
    }

    return nums;
}

/* =========================
   開獎動畫
========================= */

let running = false;

async function startLottery(){

    document.body.style.cursor = "wait";

    if(running) return;

    running = true;

    bars.forEach(bar=>{
        bar.style.animationPlayState = "running";
    });

    if(audioCtx.state === "suspended"){

        await audioCtx.resume();
    }

    const reels =
    document.querySelectorAll(".reel");

    const result =
    generateNumbers();

    for(let i=0;i<reels.length;i++){

        let reel = reels[i];

        let duration =
        700 + i*260;

        let start = Date.now();

        await new Promise(resolve=>{

            const spin = setInterval(()=>{

                let rand =
                Math.floor(Math.random()*49);

                reel.style.transform =
                `translateY(-${rand * 100}%)`;

                playSpin();

                let elapsed =
                Date.now() - start;

                if(elapsed >= duration){

                    clearInterval(spin);

                    let finalNum =
                    result[i]-1;

                    /* 撞擊感 */

                    reel.style.transform =
                    `translateY(-${finalNum * 100 - 8}%)`;

                    setTimeout(()=>{

                        reel.style.transform =
                        `translateY(-${finalNum * 100}%)`;

                    },45);

                    playStop();

                    setTimeout(resolve,80);
                }

            },32);

        });

    }

    playWin();

    /* 音效波形停止 */

    bars.forEach(bar=>{

        bar.style.animationPlayState = "paused";

        bar.style.height =
        Math.floor(Math.random()*8+5)+"px";
    });

    running = false;

    document.body.style.cursor = "default";

}

</script>

</body>
</html>
